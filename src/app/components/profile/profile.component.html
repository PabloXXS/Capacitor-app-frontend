<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Профиль</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page-content">
    <!-- Верхняя часть профиля -->
    <div class="profile-header">
      <ion-avatar class="profile-avatar">
        <ion-icon name="person"></ion-icon>
      </ion-avatar>
      <h1 class="profile-name">{{ userProfile.displayName }}</h1>
      <p class="profile-email">{{ userProfile.email }}</p>
    </div>

    <!-- Информация профиля -->
    <div class="profile-section">
      <ion-list class="profile-list">
        <ion-item button (click)="editProfile('fullName')">
          <div class="item-content">
            <p class="item-label">имя</p>
            <h3 class="item-value">{{ userProfile.fullName }}</h3>
          </div>
          <ion-icon name="chevron-forward" slot="end"></ion-icon>
        </ion-item>

        <ion-item button (click)="editProfile('publicNickname')">
          <div class="item-content">
            <p class="item-label">публичный никнейм</p>
            <h3 class="item-value">{{ userProfile.publicNickname }}</h3>
          </div>
          <ion-icon name="chevron-forward" slot="end"></ion-icon>
        </ion-item>

        <ion-item button (click)="editProfile('email')">
          <div class="item-content">
            <p class="item-label">Email</p>
            <h3 class="item-value">{{ userProfile.email }}</h3>
          </div>
          <ion-icon name="chevron-forward" slot="end"></ion-icon>
        </ion-item>
      </ion-list>
    </div>

    <!-- Настройки -->
    <div class="settings-section">
      <h2 class="section-title">настройки</h2>

      <ion-list class="settings-list">
        <ion-item>
          <div class="item-content">
            <h3 class="item-value">уведомления</h3>
          </div>
          <ion-toggle
            [checked]="settings.notifications"
            (ionChange)="onNotificationToggle($event)"
          >
          </ion-toggle>
        </ion-item>

        <ion-item button (click)="openLanguageSettings()">
          <div class="item-content">
            <h3 class="item-value">Язык</h3>
          </div>
          <div class="item-end">
            <span class="item-detail">{{ settings.language }}</span>
            <ion-icon name="chevron-forward"></ion-icon>
          </div>
        </ion-item>

        <ion-item button (click)="openThemeSettings()">
          <div class="item-content">
            <h3 class="item-value">темная тема</h3>
          </div>
          <div class="item-end">
            <span class="item-detail">{{ settings.darkMode }}</span>
            <ion-icon name="chevron-forward"></ion-icon>
          </div>
        </ion-item>
      </ion-list>
    </div>
  </div>
</ion-content>
